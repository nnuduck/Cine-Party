<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Depth -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#15161c"/>
      <stop offset="60%" stop-color="#08080a"/>
      <stop offset="100%" stop-color="#020203"/>
    </radialGradient>

    <!-- Luxury Platinum/Silver Arc Gradient -->
    <linearGradient id="silverArc" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2E4E9"/>
      <stop offset="70%" stop-color="#9CA1AB"/>
      <stop offset="100%" stop-color="#676B75"/>
    </linearGradient>

    <!-- Cinema Ruby Gradient -->
    <linearGradient id="rubyGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B50"/>
      <stop offset="50%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#B8000B"/>
    </linearGradient>

    <!-- Ambient Ruby Spotlight behind Play Triangle -->
    <radialGradient id="rubyAura" cx="45%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#E50914" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Rim Light for Card -->
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="512" height="512" fill="url(#bgGlow)"/>

  <!-- Subtle Squircle Outer Border -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#rimLight)" stroke-width="1.5"/>

  <!-- Ambient Cinema Glow in Center -->
  <circle cx="270" cy="256" r="140" fill="url(#rubyAura)"/>

  <!-- Iconic Sculpted "C" Arc (Outer radius 136, stroke 36, opening on the right) -->
  <path d="M 342 162
           A 136 136 0 1 0 342 350"
        fill="none"
        stroke="url(#silverArc)"
        stroke-width="36"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Precision Cinema Play Glyph nested inside the aperture -->
  <path d="M 232 198
           C 232 192 238 188 244 192
           L 316 248
           C 322 252 322 260 316 264
           L 244 320
           C 238 324 232 320 232 314
           Z"
        fill="url(#rubyGlow)"
        filter="drop-shadow(0px 8px 24px rgba(229, 9, 20, 0.55))"/>

  <!-- Subtle specular highlight on the play glyph top edge -->
  <path d="M 234 200 L 312 254"
        stroke="#FFFFFF"
        stroke-opacity="0.35"
        stroke-width="2"
        stroke-linecap="round"/>
</svg>